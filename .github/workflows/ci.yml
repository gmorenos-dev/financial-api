name: Financial API CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Testes automatizados
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Executar testes e gerar cobertura
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Validar Docker Compose
        env:
          DB_PASSWORD: ci-validation-only
        run: docker compose config --quiet

      - name: Iniciar ambiente Docker Compose
        env:
          DB_PASSWORD: ci-validation-only
        run: docker compose up --build --detach

      - name: Verificar API em execução
        env:
          DB_PASSWORD: ci-validation-only
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/api/transactions > /dev/null; then
              echo "API respondeu com sucesso."
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "A API não respondeu dentro do tempo esperado."
              docker compose logs
              exit 1
            fi

            sleep 2
          done

          created=$(curl --fail --silent --show-error \
            -X POST http://localhost:8080/api/transactions \
            -H "Content-Type: application/json" \
            -d '{"description":"CI Docker smoke test","amount":12.34,"type":"RECEITA","date":"2026-01-01"}')

          transaction_id=$(printf '%s' "$created" |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')

          retrieved=$(curl --fail --silent --show-error \
            "http://localhost:8080/api/transactions/${transaction_id}")

          printf '%s' "$retrieved" | python3 -c '
          import json, sys
          transaction = json.load(sys.stdin)
          assert transaction["description"] == "CI Docker smoke test"
          assert transaction["type"] == "RECEITA"
          assert float(transaction["amount"]) == 12.34
          print("Cadastro e consulta no PostgreSQL: aprovados.")
          '

      - name: Encerrar ambiente Docker
        if: always()
        env:
          DB_PASSWORD: ci-validation-only
        run: docker compose down -v

      - name: Publicar relatório JaCoCo
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

  publish-image:
    name: Publicar imagem no GHCR
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar tags e metadados
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
